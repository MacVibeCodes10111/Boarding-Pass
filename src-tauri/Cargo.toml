[package]
name = "boarding-pass"
version = "2.41.0"
description = "Boarding Pass, a small airline manager game"
authors = ["ebncraft"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name from clashing with the binary name
name = "boarding_pass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
