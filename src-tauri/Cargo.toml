[package]
name = "boarding-pass"
version = "2.53.0"
description = "Boarding Pass, a small airline manager game"
authors = ["ebncraft"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name from clashing with the binary name
name = "boarding_pass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
# Google/Discord sign-in returns from the browser as a boardingpass:// link (v2.49)
tauri-plugin-deep-link = "2"
serde_json = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# A sign-in link opened while the game runs goes to the running game, not a second copy
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
