name: Aircraft art
on:
  push:
    branches: [data/aircraft-art]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download and inspect the templates
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p tools/art/out
          python3 -m venv /tmp/venv 2>&1 | tee tools/art/out/run.log
          /tmp/venv/bin/pip install --quiet psd-tools 2>&1 | tee -a tools/art/out/run.log
          /tmp/venv/bin/python tools/art/read_templates.py 2>&1 | tee -a tools/art/out/run.log
          exit ${PIPESTATUS[0]}
      - name: Save the report and previews
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f tools/art/out || true
          git commit -m "Aircraft art: layer report and previews" || exit 0
          git push origin HEAD:data/aircraft-art
