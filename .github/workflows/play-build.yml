# ============================================================================
# Play build: the browser version of the game, ready to serve.
#
# On every push to main this builds the game (npm ci, npm run build) and puts
# the finished files from dist/ on the branch "play-build", replacing what was
# there. That branch holds only built files, so any web host that just copies
# a branch's files (like Hostinger's Git deployment for play.boardingpass.my)
# serves a working game, with no build step of its own.
#
# Pushes to the dev branch do the same into "dev-build", for the test site
# dev.boardingpass.my: with a DEV badge in the game, and search engines asked
# not to list it.
#
# Don't edit play-build or dev-build by hand: every push overwrites them.
# ============================================================================
name: Play build

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

# Only the newest push of each branch matters; an older build still running is cancelled
concurrency:
  group: play-build-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build the browser version (${{ github.ref_name }})
    runs-on: ubuntu-latest
    env:
      # main → play-build (play.boardingpass.my); dev → dev-build (dev.boardingpass.my)
      TARGET: ${{ github.ref_name == 'dev' && 'dev-build' || 'play-build' }}
      VITE_BP_CHANNEL: ${{ github.ref_name == 'dev' && 'dev' || '' }}
      VITE_BP_BUILD: ${{ github.ref_name == 'dev' && github.run_number || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Server settings for the built files
        # Apache/LiteSpeed (Hostinger): the right file type for the web app
        # manifest, and index.html always re-checked so new versions show up
        # straight away. Built scripts have their version in the file name, so
        # they can be cached for a long time.
        run: |
          cat > dist/.htaccess <<'EOF'
          AddType application/manifest+json .webmanifest
          AddType application/javascript .js .mjs
          <IfModule mod_headers.c>
            # Security (v2.50): no framing by other sites, no type guessing
            Header always set Content-Security-Policy "frame-ancestors 'none'"
            Header always set X-Frame-Options "DENY"
            Header always set X-Content-Type-Options "nosniff"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
            Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
            <FilesMatch "^(index\.html|manifest\.webmanifest)$">
              Header set Cache-Control "no-cache"
            </FilesMatch>
            <FilesMatch "\.(js|css)$">
              Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
          </IfModule>
          EOF
          cat > dist/README.md <<EOF
          # $TARGET

          Built files of the browser version of Boarding Pass, made by the
          "Play build" workflow from ${GITHUB_REF_NAME} (commit ${GITHUB_SHA::7}). Every push
          to ${GITHUB_REF_NAME} replaces this branch. The source is on the ${GITHUB_REF_NAME} branch.
          EOF
          if [ "$TARGET" = dev-build ]; then
            # The test site: not for search engines
            printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
            sed -i 's#<head>#<head><meta name="robots" content="noindex, nofollow">#' dist/index.html
          fi

      - name: Publish to the ${{ env.TARGET }} branch
        working-directory: dist
        run: |
          git init -q -b "$TARGET"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Play build of ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$TARGET"
          echo "Published $(git ls-files | wc -l) files to $TARGET" >> "$GITHUB_STEP_SUMMARY"
