# ============================================================================
# Release: builds Boarding Pass on GitHub's own Mac and Windows machines and
# publishes the downloads on the Releases page.
#
# Runs when a new version lands on main (the version in src-tauri/tauri.conf.json
# changes; every update changes it), when a version tag is pushed, or by hand from
# the Actions tab ("Run workflow"). The release and its tag (v2.27.0, ...) are
# created here, from that version number. Running again for the same version
# just replaces the downloads.
#
# Auto-updates: the release also gets latest.json and a signature (.sig) for
# each download. The game reads latest.json to find new versions, and only
# installs a download whose signature matches the public key in tauri.conf.json.
# The matching private key and its password are the repository secrets
# TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
# Without them the build stops at "Check the update key is set up".
# ============================================================================
name: Release

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/tauri.conf.json'
      - '.github/workflows/release.yml'
    tags: ['v*']
  workflow_dispatch:

# One release build at a time; a newer push waits for the one in progress
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac
            platform: macos-15-intel
            # One app for both Apple-chip and Intel Macs, as a .dmg
            args: --target universal-apple-darwin --bundles app,dmg
          - name: Windows
            platform: windows-latest
            # Installer (.exe) and Windows Installer package (.msi)
            args: --bundles nsis,msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'Mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Reuse the Rust build from last time (faster)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Check the update key is set up
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PASS" ]; then
            echo "::error::The update key isn't set up. In the repository, open Settings → Secrets and variables → Actions and add TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD, then run this again (Re-run all jobs)."
            exit 1
          fi

      - name: Install the game's packages
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files so installed games trust them
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Boarding Pass v__VERSION__
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          # Windows updates use the .exe installer, which is what most people install
          updaterJsonPreferNsis: true
          releaseBody: |
            A small airline manager game. Free to play.

            ## Download
            - **Mac** (Apple-chip and Intel, macOS 11 or later): `Boarding.Pass_…_universal.dmg`
            - **Windows** (64-bit): `Boarding.Pass_…_x64-setup.exe` (or the `.msi`)

            These builds aren't code-signed, so the first time you open the game:
            - **Mac:** open the .dmg and drag Boarding Pass into Applications. Open it once; if macOS says it can't check the app, go to **System Settings → Privacy & Security** and click **Open Anyway**. If it says the app is "damaged", run this in Terminal, then open it again:
              `xattr -cr "/Applications/Boarding Pass.app"`
            - **Windows:** if SmartScreen appears, click **More info → Run anyway**.

            **Updates:** from 2.28 on, the game updates itself. When a new version is out it offers it when you start the game; click **Update now** and it saves your career, installs the update and restarts. If you have 2.27 or earlier, download and install this version by hand once.

            The game needs the internet for the map. To bring a career across from another computer: there, **Menu → Export save file**; here, **Import save file** on the home screen.

            What's new: see [the README](https://github.com/MacVibeCodes10111/Boarding-Pass#whats-new). Credits and licences: [THIRD_PARTY_NOTICES.md](https://github.com/MacVibeCodes10111/Boarding-Pass/blob/main/THIRD_PARTY_NOTICES.md).
