# Boarding Pass logos (Update A, phase A2): keeps players' livery logos (square, up to 1024x1024 and 48 KB)
# in the R2 bucket, with a hard cap on the whole bucket. See README.md to deploy.
# Everything here is public. The one secret, CLEANUP_KEY, lives only in Cloudflare.
name = "bp-logos"
main = "src/index.ts"
compatibility_date = "2026-10-13"
workers_dev = true

[vars]
SUPABASE_URL = "https://dlgkdknfxhmtkhpegufq.supabase.co"
SUPABASE_KEY = "sb_publishable_AP8t-FaDMPZ0dHYFezBqPQ_MDoYkfXv"
ALLOWED_ORIGINS = "https://play.boardingpass.my,https://test.boardingpass.my,tauri://localhost,http://tauri.localhost,https://tauri.localhost,http://localhost:1420,https://bp-admin.boardingpass-game.workers.dev,http://localhost:1430"

[triggers]
crons = ["17 4 * * *"]

[[r2_buckets]]
binding = "LOGOS"
bucket_name = "bplogos"

[[d1_databases]]
binding = "DB"
database_name = "bp-uploads"
database_id = "a1b4ee7f-39e0-47b7-90dd-6be0e771225b"
